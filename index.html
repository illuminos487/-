<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전용장비 4부위 조율 시뮬레이터 (4부위 동시 자동 잠금)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-align: center;
        }
        .stats-container {
            background-color: #222;
            border: 1px solid #444;
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ddd;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .stats-container span {
            color: #4CAF50;
            font-size: 1.3em;
            margin: 0 5px;
        }
        .auto-tune-container {
            background-color: #2b3a42;
            border: 2px solid #3a505e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 900px;
        }
        .auto-tune-container h3 { margin: 0 0 5px 0; color: #81ecec; font-size: 1.2em; }
        .auto-tune-desc { font-size: 0.9em; color: #bdc3c7; margin-bottom: 15px; text-align: center; }
        .auto-tune-grid { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .target-col { background-color: #1a252c; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; border: 1px solid #3a505e; width: 160px; }
        .target-col label { color: #ffd700; font-weight: bold; font-size: 1.1em; }
        .target-col select { width: 100%; padding: 8px; border-radius: 4px; background-color: #111; color: #fff; border: 1px solid #555; font-size: 0.95em; }
        .auto-btn { background-color: #0984e3; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: background-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .auto-btn:hover { background-color: #74b9ff; }
        .auto-btn:active { background-color: #0984e3; transform: translateY(2px); }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1000px; }
        .slot-card { background-color: #2a2a2a; border-radius: 10px; padding: 20px; width: 200px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 2px solid #444; transition: all 0.3s ease; position: relative; }
        .slot-card.is-locked { border-color: #c0392b; box-shadow: 0 0 10px rgba(192, 57, 43, 0.5); }
        .slot-title { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #ddd; }
        .status-box { background-color: #111; padding: 15px 10px; border-radius: 5px; margin-bottom: 10px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
        .tier { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .tier.None { color: #888; }
        .tier.고급 { color: #a3c2c2; }
        .tier.희귀 { color: #b184e1; }
        .tier.전설 { color: #ffd700; }
        .option { font-size: 0.9em; margin-bottom: 5px; }
        .stat { font-size: 1.2em; font-weight: bold; color: #4CAF50; }
        .lock-btn { background-color: #333; color: #ccc; border: 1px solid #555; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9em; width: 100%; margin-bottom: 10px; transition: all 0.2s; }
        .lock-btn.locked { background-color: #5a2a2a; color: #ffaaaa; border-color: #e74c3c; }
        .lock-btn:hover:not(:disabled) { background-color: #444; }
        .lock-btn.locked:hover:not(:disabled) { background-color: #7a3a3a; }
        .tune-btn { background-color: #444; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; transition: background-color 0.2s; }
        .tune-btn:hover:not(:disabled) { background-color: #666; }
        .tune-btn:active:not(:disabled) { background-color: #888; }
        .tune-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .controls { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .tune-all-btn { background-color: #c0392b; color: white; border: none; padding: 15px 40px; border-radius: 5px; cursor: pointer; font-size: 1.2em; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background-color 0.2s; }
        .tune-all-btn:hover { background-color: #e74c3c; }
        .tune-all-btn:active { background-color: #c0392b; }
        .reset-btn { background-color: #555; color: #ddd; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        .reset-btn:hover { background-color: #777; }
    </style>
</head>
<body>
    <h1>전용장비 4부위 조율 시뮬레이터</h1>
    <div class="stats-container">
        <div>총 시도 횟수: <span id="attempt-count">0</span>회</div>
        <div>사용된 조율석: <span id="stone-count">0</span>개</div>
    </div>
    
    <div class="auto-tune-container">
        <h3>🤖 4부위 동시 목표 달성 (자동 잠금)</h3>
        <p class="auto-tune-desc">각 부위별 원하는 목표를 설정하고 시작을 누르면, 조건에 맞는 옵션이 나올 때마다 <br>해당 부위를 <b>자동으로 잠그고</b> 남은 부위를 마저 돌립니다.</p>
        <div class="auto-tune-grid">
            <script>
                const targetOptionsHtml = `
                    <option value="ANY">상관없음</option>
                    <option value="모든 공격력(%)">모든 공격력(%)</option>
                    <option value="방어력(%)">방어력(%)</option>
                    <option value="생명력(%)">생명력(%)</option>
                    <option value="효과 적중">효과 적중</option>
                    <option value="효과 저항">효과 저항</option>
                    <option value="피해 증폭">피해 증폭</option>
                    <option value="파쇄">파쇄</option>
                    <option value="탄성">탄성</option>
                    <option value="재생">재생</option>
                `;
                const targetTiersHtml = `
                    <option value="ANY">상관없음</option>
                    <option value="전설">전설</option>
                    <option value="전설/희귀">전설 또는 희귀</option>
                    <option value="희귀">희귀</option>
                    <option value="고급">고급</option>
                `;
                for (let i = 0; i < 4; i++) {
                    document.write(`
                        <div class="target-col">
                            <label>장비 부위 ${i+1}</label>
                            <select id="target-tier-${i}">${targetTiersHtml}</select>
                            <select id="target-opt-${i}">${targetOptionsHtml}</select>
                        </div>
                    `);
                }
            </script>
        </div>
        <button class="auto-btn" onclick="runFullAutoTuning()">전체 자동 조율 시작</button>
    </div>
    
    <div class="container" id="slots-container"></div>
    <div class="controls">
        <button class="tune-all-btn" onclick="tuneAll()">전체 조율 1회 (잠금 제외)</button>
        <button class="reset-btn" onclick="resetSimulator()">시뮬레이터 초기화 (잠금 해제)</button>
    </div>

    <script>
        const tiers = ['고급', '희귀', '전설'];
        const options = ['모든 공격력(%)', '방어력(%)', '생명력(%)', '효과 적중', '효과 저항', '피해 증폭', '파쇄', '탄성', '재생'];
        const stats = {
            '고급': ['5%', '5%', '5%', '4%', '4%', '1.6%', '4.8%', '6%', '2.4%'],
            '희귀': ['7%', '7%', '7%', '6%', '6%', '2.4%', '7.2%', '9%', '3.6%'],
            '전설': ['12%', '12%', '12%', '10%', '10%', '4%', '12%', '15%', '6%']
        };

        let slotStates = Array(4).fill(null).map(() => ({ tier: null, option: null, stat: null, isLocked: false }));
        let totalAttempts = 0;

        function getRandomTier() {
            let rand = Math.random() * 100;
            if (rand < 45) return '고급';
            if (rand < 80) return '희귀';
            return '전설';
        }
        
        function updateStats() {
            document.getElementById('attempt-count').innerText = totalAttempts.toLocaleString();
            document.getElementById('stone-count').innerText = (totalAttempts * 50).toLocaleString();
        }

        function rollTuning(slotIndex, isBulk = false) {
            let currentState = slotStates[slotIndex];
            if (currentState.isLocked) return false;
            
            while (true) {
                let rolledTier = getRandomTier();
                let rolledOptionIdx = Math.floor(Math.random() * 9);
                let rolledOption = options[rolledOptionIdx];
                let rolledStat = stats[rolledTier][rolledOptionIdx];

                if (rolledTier === currentState.tier && rolledOption === currentState.option) continue;

                slotStates[slotIndex] = { tier: rolledTier, option: rolledOption, stat: rolledStat, isLocked: false };
                break;
            }
            
            totalAttempts++;
            if (!isBulk) { updateStats(); renderSlots(); }
            return true;
        }

        function runFullAutoTuning() {
            let allAlreadyLocked = slotStates.every(s => s.isLocked);
            if (allAlreadyLocked) {
                alert("모든 부위가 이미 잠겨있습니다. 잠금을 해제하거나 시뮬레이터를 초기화해주세요.");
                return;
            }

            let targets = [];
            for (let i = 0; i < 4; i++) {
                targets.push({
                    tier: document.getElementById(`target-tier-${i}`).value,
                    option: document.getElementById(`target-opt-${i}`).value
                });
            }

            let cycles = 0;
            const maxCycles = 100000;
            let finished = false;

            while (cycles < maxCycles) {
                let allMetInThisCycle = true;
                for (let i = 0; i < 4; i++) {
                    if (!slotStates[i].isLocked) {
                        rollTuning(i, true);
                        
                        let targetTierValue = targets[i].tier;
                        let currentTierValue = slotStates[i].tier;
                        let matchTier = false;
                        
                        if (targetTierValue === 'ANY') {
                            matchTier = true;
                        } else if (targetTierValue === '전설/희귀') {
                            matchTier = (currentTierValue === '전설' || currentTierValue === '희귀');
                        } else {
                            matchTier = (currentTierValue === targetTierValue);
                        }

                        let matchOption = (targets[i].option === 'ANY' || slotStates[i].option === targets[i].option);
                        
                        if (matchTier && matchOption) {
                            slotStates[i].isLocked = true;
                        } else {
                            allMetInThisCycle = false;
                        }
                    }
                }
                cycles++;
                if (allMetInThisCycle) { finished = true; break; }
            }
            updateStats();
            renderSlots();
            if (!finished) { alert(`안전 장치 발동: 10만번 사이클 이상 조율을 시도했지만 모든 목표를 달성하지 못했습니다.`); }
        }

        function tuneAll() {
            let rolledAny = false;
            for (let i = 0; i < 4; i++) {
                if (!slotStates[i].isLocked) {
                    if (rollTuning(i, true)) rolledAny = true;
                }
            }
            if (rolledAny) { updateStats(); renderSlots(); }
        }

        function toggleLock(slotIndex) {
            if (slotStates[slotIndex].tier === null) return;
            slotStates[slotIndex].isLocked = !slotStates[slotIndex].isLocked;
            renderSlots();
        }
        
        function resetSimulator() {
            slotStates = Array(4).fill(null).map(() => ({ tier: null, option: null, stat: null, isLocked: false }));
            totalAttempts = 0;
            updateStats();
            renderSlots();
        }

        function renderSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            slotStates.forEach((state, index) => {
                const card = document.createElement('div');
                card.className = `slot-card ${state.isLocked ? 'is-locked' : ''}`;
                
                let statusHtml = '<div class="status-box">';
                let lockDisabled = state.tier === null ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : '';
                
                if (state.tier === null) {
                    statusHtml += `<div class="tier None">빈 슬롯</div><div class="option">-</div><div class="stat">-</div>`;
                } else {
                    statusHtml += `<div class="tier ${state.tier}">${state.tier}</div><div class="option">${state.option}</div><div class="stat">${state.stat}</div>`;
                }
                statusHtml += '</div>';

                let lockBtnHtml = `<button class="lock-btn ${state.isLocked ? 'locked' : ''}" onclick="toggleLock(${index})" ${lockDisabled}>${state.isLocked ? '🔒 잠금됨' : '🔓 잠금 해제'}</button>`;
                let tuneBtnHtml = `<button class="tune-btn" onclick="rollTuning(${index})" ${state.isLocked ? 'disabled' : ''}>조율하기</button>`;

                card.innerHTML = `<div class="slot-title">장비 부위 ${index + 1}</div>${statusHtml}${lockBtnHtml}${tuneBtnHtml}`;
                container.appendChild(card);
            });
        }
        updateStats();
        renderSlots();
    </script>
</body>
</html>
