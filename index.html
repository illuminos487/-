
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전용장비 4부위 조율 시뮬레이터 (V3 - 로그 & 개별 오토)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #1a1a1a; color: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        h1 { color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px; text-align: center; }
        .stats-container { background-color: #222; border: 1px solid #444; padding: 15px 30px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 40px; font-size: 1.2em; font-weight: bold; color: #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .stats-container span { color: #4CAF50; font-size: 1.3em; margin: 0 5px; }
        
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1100px; margin-bottom: 20px; }
        .slot-card { background-color: #2a2a2a; border-radius: 10px; padding: 20px; width: 220px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border: 2px solid #444; transition: all 0.3s ease; position: relative; display: flex; flex-direction: column; }
        .slot-card.is-locked { border-color: #c0392b; box-shadow: 0 0 10px rgba(192, 57, 43, 0.5); }
        .slot-title { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #ddd; }
        
        .status-box { background-color: #111; padding: 15px 10px; border-radius: 5px; margin-bottom: 15px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
        .tier { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .tier.None { color: #888; }
        .tier.고급 { color: #a3c2c2; }
        .tier.희귀 { color: #b184e1; }
        .tier.전설 { color: #ffd700; }
        .option { font-size: 0.9em; margin-bottom: 5px; }
        .stat { font-size: 1.2em; font-weight: bold; color: #4CAF50; }
        
        .target-box { background-color: #1f2a30; border: 1px solid #3a505e; border-radius: 5px; padding: 10px; margin-bottom: 15px; text-align: left; }
        .target-box-title { font-size: 0.85em; color: #81ecec; margin-bottom: 5px; font-weight: bold; text-align: center; }
        .target-sel { width: 100%; padding: 5px; margin-bottom: 5px; border-radius: 3px; background-color: #111; color: #fff; border: 1px solid #555; font-size: 0.9em; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        .btn { border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 0.95em; font-weight: bold; transition: all 0.2s; color: white; width: 100%; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-auto-single { background-color: #0984e3; }
        .btn-auto-single:hover:not(:disabled) { background-color: #74b9ff; }
        
        .btn-tune { background-color: #444; }
        .btn-tune:hover:not(:disabled) { background-color: #666; }
        
        .btn-lock { background-color: #333; color: #ccc; border: 1px solid #555; }
        .btn-lock.locked { background-color: #5a2a2a; color: #ffaaaa; border-color: #e74c3c; }
        .btn-lock:hover:not(:disabled) { background-color: #444; }
        .btn-lock.locked:hover:not(:disabled) { background-color: #7a3a3a; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn-full-auto { background-color: #c0392b; padding: 15px 30px; font-size: 1.1em; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-full-auto:hover { background-color: #e74c3c; }
        .btn-full-tune { background-color: #d35400; padding: 15px 30px; font-size: 1.1em; }
        .btn-full-tune:hover { background-color: #e67e22; }
        .btn-reset { background-color: #555; padding: 15px 20px; }
        .btn-reset:hover { background-color: #777; }
        
        .log-container { width: 100%; max-width: 1000px; background-color: #111; border: 1px solid #444; border-radius: 8px; padding: 15px; max-height: 250px; overflow-y: auto; font-size: 0.95em; color: #bbb; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .log-title { font-size: 1.1em; color: #fff; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; position: sticky; top: -15px; background-color: #111; z-index: 10; }
        .log-entry { margin-bottom: 4px; line-height: 1.4; border-bottom: 1px dashed #222; padding-bottom: 4px; }
        .log-entry span.고급 { color: #a3c2c2; font-weight: bold; }
        .log-entry span.희귀 { color: #b184e1; font-weight: bold; }
        .log-entry span.전설 { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>
    <h1>전용장비 4부위 조율 시뮬레이터</h1>
    
    <div class="stats-container">
        <div>총 시도 횟수: <span id="attempt-count">0</span>회</div>
        <div>사용된 조율석: <span id="stone-count">0</span>개</div>
    </div>
    
    <div class="container" id="slots-container"></div>
    
    <div class="controls">
        <button class="btn btn-full-auto" onclick="runFullAutoTuning()">전체 자동 조율 (목표 달성시 잠금)</button>
        <button class="btn btn-full-tune" onclick="tuneAll()">전체 조율 1회</button>
        <button class="btn btn-reset" onclick="resetSimulator()">초기화</button>
    </div>
    
    <div class="log-container">
        <div class="log-title">📜 조율 로그 기록 (최근 500회)</div>
        <div id="log-box">조율을 시작하면 기록이 표시됩니다.</div>
    </div>

    <script>
        const tiers = ['고급', '희귀', '전설'];
        const options = ['모든 공격력(%)', '방어력(%)', '생명력(%)', '효과 적중', '효과 저항', '피해 증폭', '파쇄', '탄성', '재생'];
        const stats = {
            '고급': ['5%', '5%', '5%', '4%', '4%', '1.6%', '4.8%', '6%', '2.4%'],
            '희귀': ['7%', '7%', '7%', '6%', '6%', '2.4%', '7.2%', '9%', '3.6%'],
            '전설': ['12%', '12%', '12%', '10%', '10%', '4%', '12%', '15%', '6%']
        };

        // 각 슬롯의 목표값(target)도 상태로 저장하여 렌더링 시 유지되도록 함
        let slotStates = Array(4).fill(null).map(() => ({ 
            tier: null, option: null, stat: null, isLocked: false, targetTier: 'ANY', targetOpt: 'ANY' 
        }));
        
        let totalAttempts = 0;
        let logHistory = [];
        let tempLogs = []; // 고속 오토 시뮬레이션용 임시 로그 배열

        function getRandomTier() {
            let rand = Math.random() * 100;
            if (rand < 45) return '고급';
            if (rand < 80) return '희귀';
            return '전설';
        }
        
        function updateStats() {
            document.getElementById('attempt-count').innerText = totalAttempts.toLocaleString();
            document.getElementById('stone-count').innerText = (totalAttempts * 50).toLocaleString();
        }
        
        function addLogBox(msg, isBulk) {
            if (isBulk) {
                tempLogs.push(msg);
            } else {
                logHistory.unshift(msg);
                if (logHistory.length > 500) logHistory.pop();
            }
        }
        
        function renderLogs() {
            if (tempLogs.length > 0) {
                // 임시 로그들을 뒤집어서(최신이 위로 오게) 병합하고 500개 유지
                logHistory = tempLogs.reverse().concat(logHistory).slice(0, 500);
                tempLogs = [];
            }
            const logBox = document.getElementById('log-box');
            if (logHistory.length === 0) {
                logBox.innerHTML = "조율을 시작하면 기록이 표시됩니다.";
            } else {
                logBox.innerHTML = logHistory.map(log => `<div class="log-entry">${log}</div>`).join('');
            }
        }

        function rollTuning(slotIndex, isBulk = false) {
            let currentState = slotStates[slotIndex];
            if (currentState.isLocked) return false;
            
            let rolledTier, rolledOption, rolledStat;
            while (true) {
                rolledTier = getRandomTier();
                let rolledOptionIdx = Math.floor(Math.random() * 9);
                rolledOption = options[rolledOptionIdx];
                rolledStat = stats[rolledTier][rolledOptionIdx];

                if (rolledTier === currentState.tier && rolledOption === currentState.option) continue;
                
                slotStates[slotIndex].tier = rolledTier;
                slotStates[slotIndex].option = rolledOption;
                slotStates[slotIndex].stat = rolledStat;
                slotStates[slotIndex].isLocked = false;
                break;
            }
            
            totalAttempts++;
            
            // 로그 포맷팅
            let logStr = `[${totalAttempts}회차] 부위 ${slotIndex+1} ➔ <span class="${rolledTier}">[${rolledTier}]</span> ${rolledOption} (${rolledStat})`;
            addLogBox(logStr, isBulk);
            
            if (!isBulk) { 
                updateStats(); 
                renderSlots(); 
                renderLogs();
            }
            return true;
        }
        
        // --- 1부위 개별 자동 조율 ---
        function runSingleAuto(index) {
            let state = slotStates[index];
            if (state.isLocked) {
                alert("해당 부위가 잠겨있습니다. 잠금을 해제해주세요.");
                return;
            }
            if (state.targetTier === 'ANY' && state.targetOpt === 'ANY') {
                alert("이 부위의 목표(등급이나 옵션)를 설정해주세요.");
                return;
            }
            
            let cycles = 0;
            let finished = false;
            
            while (cycles < 50000) {
                rollTuning(index, true);
                let currentTier = slotStates[index].tier;
                let currentOpt = slotStates[index].option;
                
                let matchTier = false;
                if (state.targetTier === 'ANY') matchTier = true;
                else if (state.targetTier === '전설/희귀') matchTier = (currentTier === '전설' || currentTier === '희귀');
                else matchTier = (currentTier === state.targetTier);
                
                let matchOpt = (state.targetOpt === 'ANY' || currentOpt === state.targetOpt);
                
                if (matchTier && matchOpt) {
                    slotStates[index].isLocked = true; // 달성시 자동 잠금
                    finished = true;
                    break;
                }
                cycles++;
            }
            updateStats();
            renderSlots();
            renderLogs();
            if (!finished) alert(`안전 장치 발동: 5만번을 돌렸으나 목표를 달성하지 못했습니다.`);
        }

        // --- 4부위 동시 자동 조율 ---
        function runFullAutoTuning() {
            let activeTargets = 0;
            for (let i = 0; i < 4; i++) {
                if (!slotStates[i].isLocked && (slotStates[i].targetTier !== 'ANY' || slotStates[i].targetOpt !== 'ANY')) {
                    activeTargets++;
                }
            }
            if (activeTargets === 0) {
                alert("잠겨있지 않은 슬롯 중 목표가 설정된 부위가 없습니다.");
                return;
            }

            let cycles = 0;
            let finished = false;

            while (cycles < 100000) {
                let allTargetsMet = true;
                
                for (let i = 0; i < 4; i++) {
                    if (!slotStates[i].isLocked) {
                        rollTuning(i, true);
                        
                        let tTier = slotStates[i].targetTier;
                        let tOpt = slotStates[i].targetOpt;
                        
                        // 목표가 '상관없음(ANY)'인 부위는 굴러가기만 하고 조건을 만족하는지 체크하지 않음 (=잠기지 않음)
                        if (tTier !== 'ANY' || tOpt !== 'ANY') {
                            let cTier = slotStates[i].tier;
                            let cOpt = slotStates[i].option;
                            
                            let matchTier = false;
                            if (tTier === 'ANY') matchTier = true;
                            else if (tTier === '전설/희귀') matchTier = (cTier === '전설' || cTier === '희귀');
                            else matchTier = (cTier === tTier);
                            
                            let matchOpt = (tOpt === 'ANY' || cOpt === tOpt);
                            
                            if (matchTier && matchOpt) {
                                slotStates[i].isLocked = true;
                            } else {
                                allTargetsMet = false;
                            }
                        }
                    }
                }
                
                cycles++;
                if (allTargetsMet) { finished = true; break; }
            }
            updateStats();
            renderSlots();
            renderLogs();
            if (!finished) { alert(`안전 장치 발동: 10만번 사이클 이상 조율을 시도했지만 모든 목표를 달성하지 못했습니다.`); }
        }

        function tuneAll() {
            let rolledAny = false;
            for (let i = 0; i < 4; i++) {
                if (!slotStates[i].isLocked) {
                    if (rollTuning(i, true)) rolledAny = true;
                }
            }
            if (rolledAny) { updateStats(); renderSlots(); renderLogs(); }
        }

        function toggleLock(slotIndex) {
            if (slotStates[slotIndex].tier === null) return;
            slotStates[slotIndex].isLocked = !slotStates[slotIndex].isLocked;
            renderSlots();
        }
        
        function updateTargetState(index, type, value) {
            if (type === 'tier') slotStates[index].targetTier = value;
            if (type === 'opt') slotStates[index].targetOpt = value;
        }
        
        function resetSimulator() {
            slotStates = Array(4).fill(null).map(() => ({ tier: null, option: null, stat: null, isLocked: false, targetTier: 'ANY', targetOpt: 'ANY' }));
            totalAttempts = 0;
            logHistory = [];
            tempLogs = [];
            updateStats();
            renderSlots();
            renderLogs();
        }

        const targetOptionsHtml = `
            <option value="ANY">상관없음</option>
            <option value="모든 공격력(%)">모든 공격력(%)</option>
            <option value="방어력(%)">방어력(%)</option>
            <option value="생명력(%)">생명력(%)</option>
            <option value="효과 적중">효과 적중</option>
            <option value="효과 저항">효과 저항</option>
            <option value="피해 증폭">피해 증폭</option>
            <option value="파쇄">파쇄</option>
            <option value="탄성">탄성</option>
            <option value="재생">재생</option>
        `;
        const targetTiersHtml = `
            <option value="ANY">상관없음</option>
            <option value="전설">전설</option>
            <option value="전설/희귀">전설 또는 희귀</option>
            <option value="희귀">희귀</option>
            <option value="고급">고급</option>
        `;

        function renderSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            slotStates.forEach((state, index) => {
                const card = document.createElement('div');
                card.className = `slot-card ${state.isLocked ? 'is-locked' : ''}`;
                
                let statusHtml = '<div class="status-box">';
                let lockDisabled = state.tier === null ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : '';
                
                if (state.tier === null) {
                    statusHtml += `<div class="tier None">빈 슬롯</div><div class="option">-</div><div class="stat">-</div>`;
                } else {
                    statusHtml += `<div class="tier ${state.tier}">${state.tier}</div><div class="option">${state.option}</div><div class="stat">${state.stat}</div>`;
                }
                statusHtml += '</div>';
                
                // 목표 설정 박스를 슬롯 카드 내부로 이동
                let targetBoxHtml = `
                    <div class="target-box">
                        <div class="target-box-title">목표 설정</div>
                        <select class="target-sel" onchange="updateTargetState(${index}, 'tier', this.value)">
                            ${targetTiersHtml.replace(`value="${state.targetTier}"`, `value="${state.targetTier}" selected`)}
                        </select>
                        <select class="target-sel" onchange="updateTargetState(${index}, 'opt', this.value)">
                            ${targetOptionsHtml.replace(`value="${state.targetOpt}"`, `value="${state.targetOpt}" selected`)}
                        </select>
                    </div>
                `;

                let buttonsHtml = `
                    <div class="btn-group">
                        <button class="btn btn-auto-single" onclick="runSingleAuto(${index})" ${state.isLocked ? 'disabled' : ''}>이 부위만 자동 조율</button>
                        <button class="btn btn-tune" onclick="rollTuning(${index})" ${state.isLocked ? 'disabled' : ''}>1회 조율</button>
                        <button class="btn btn-lock ${state.isLocked ? 'locked' : ''}" onclick="toggleLock(${index})" ${lockDisabled}>${state.isLocked ? '🔒 잠금됨' : '🔓 잠금 해제'}</button>
                    </div>
                `;

                card.innerHTML = `<div class="slot-title">장비 부위 ${index + 1}</div>${statusHtml}${targetBoxHtml}${buttonsHtml}`;
                container.appendChild(card);
            });
        }
        updateStats();
        renderSlots();
        renderLogs();
    </script>
</body>
</html>
